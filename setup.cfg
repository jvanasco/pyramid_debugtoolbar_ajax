[metadata]
name = pyramid_debugtoolbar_ajax
version = attr: pyramid_debugtoolbar_ajax.__VERSION__
description = Ajax support for pyramid_debugtoolbar
long_description = file: README.md
long_description_content_type = text/markdown
author = Jonathan Vanasco
author_email = jvanasco@2xlp.com
url = https://github.com/jvanasco/pyramid_debugtoolbar_ajax
keywords = web, pyramid, ajax, debug
license = MIT
classifiers =
    Intended Audience :: Developers
    Framework :: Pyramid
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3.15

[options]
python_requires = >=3.7
package_dir =
    = src
packages = find:
include_package_data = True
zip_safe = False
install_requires =
    pyramid_debugtoolbar>=4.0
    setuptools<82; python_version < "3.10"

[options.packages.find]
where = src

[options.extras_require]
testing =
    pytest
    pyramid

[tox:tox]
envlist = py3{7,8,9,10,11,12,13,14,15}

[testenv]
extras = testing
deps = coverage
commands =
    coverage run --source=pyramid_debugtoolbar_ajax -m pytest {posargs}
    coverage html
