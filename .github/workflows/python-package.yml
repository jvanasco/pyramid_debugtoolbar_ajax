name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.7", tox: py37, runner: ubuntu-22.04}
          - {python: "3.8", tox: py38, runner: ubuntu-22.04}
          - {python: "3.9", tox: py39, runner: ubuntu-22.04}
          - {python: "3.10", tox: py310, runner: ubuntu-latest}
          - {python: "3.11", tox: py311, runner: ubuntu-latest}
          - {python: "3.12", tox: py312, runner: ubuntu-latest}
          - {python: "3.13", tox: py313, runner: ubuntu-latest}
          - {python: "3.14", tox: py314, runner: ubuntu-latest}
          - {python: "3.15", tox: py315, runner: ubuntu-latest}
    steps:
      - uses: actions/checkout@v7
      - name: Set up test Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: ${{ matrix.tox == 'py315' }}
      - name: Set up tox Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ (matrix.tox == 'py37' || matrix.tox == 'py38') && '3.12' || '3.14' }}
      # Current virtualenv releases cannot seed Python 3.7 or 3.8.
      - name: Install tox for Python 3.7 and 3.8
        if: matrix.tox == 'py37' || matrix.tox == 'py38'
        run: python -m pip install "tox==4.23.2" "virtualenv==20.26.6"
      - name: Install tox
        if: matrix.tox != 'py37' && matrix.tox != 'py38'
        run: python -m pip install "tox>=4"
      - run: python -m tox run -e ${{ matrix.tox }}
      - name: Upload HTML coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.tox }}
          path: htmlcov/
          if-no-files-found: error
